name: Deploy

# Build the image, push to GHCR, then deploy to the single EC2 host via SSH.
# Required repo secrets (Settings → Secrets and variables → Actions):
#   EC2_HOST       public IP / DNS of the instance
#   EC2_USER       SSH user (e.g. ec2-user or ubuntu)
#   EC2_SSH_KEY    private SSH key with access to the instance
#   GHCR_PAT       (optional) PAT with read:packages, only if the image is PRIVATE
# The host must already have: Docker + compose plugin, ~/ayla/.env, and the repo
# checked out is NOT required — the compose file is copied by this workflow.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute lowercase image name
        id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy compose file to the instance
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: docker-compose.prod.yml
          target: ~/ayla

      - name: Pull, migrate, and (re)start on the instance
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: APP_IMAGE,GHCR_USERNAME,GHCR_PAT
          script: |
            set -euo pipefail
            cd ~/ayla
            export APP_IMAGE="${{ needs.build-and-push.outputs.image }}:${{ github.sha }}"
            # Authenticate to GHCR only if the package is private (GHCR_PAT set).
            if [ -n "${GHCR_PAT:-}" ]; then
              echo "$GHCR_PAT" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
            fi
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml run --rm app npx prisma migrate deploy
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f
        env:
          APP_IMAGE: ${{ needs.build-and-push.outputs.image }}:${{ github.sha }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
